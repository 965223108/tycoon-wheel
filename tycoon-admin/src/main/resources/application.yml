# ============================================================
# 本地只保留「引导配置」；业务配置见 Nacos: tycoon-admin.yaml
# ============================================================
spring:
  application:
    name: tycoon-admin

  config:
    import:
      - optional:nacos:tycoon-admin.yaml?group=DEFAULT_GROUP&refreshEnabled=true

  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
        refresh-enabled: true
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
