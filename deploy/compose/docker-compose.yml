name: tycoon

networks:
  tycoon-net:
    name: tycoon-net
    driver: bridge

volumes:
  nacos-data:
  nacos-logs:

services:

  # ---------------- 注册中心 / 配置中心 ----------------
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: tycoon-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"     # 控制台 / HTTP OpenAPI
      - "9848:9848"     # 2.x 客户端 gRPC 端口
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    networks:
      - tycoon-net

  # ---------------- 业务应用（多实例） ----------------
  app:
    image: tycoon-wheel:1.0.0
    restart: unless-stopped
    depends_on:
      - nacos
    # 给优雅停机留足时间（应用内配置了 graceful shutdown）
    stop_grace_period: 30s
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8787"
      DB_HOST: tycoon-mysql
      DB_PORT: "3306"
      DB_NAME: tycoon
      DB_USER: tycoon
      DB_PASSWORD: tycoon123
      NACOS_ADDR: nacos:8848
      TZ: Asia/Shanghai
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 512M
    networks:
      - tycoon-net

  # ---------------- 网关 ----------------
  gateway:
    image: tycoon-gateway:1.0.0
    container_name: tycoon-gateway
    restart: unless-stopped
    depends_on:
      - nacos
      - app
    environment:
      NACOS_ADDR: nacos:8848
      TZ: Asia/Shanghai
    ports:
      - "8081:8080"     # 便于直连网关排查；正式入口走 nginx
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - tycoon-net

  # ---------------- 入口反向代理 ----------------
  nginx:
    image: nginx:alpine
    container_name: tycoon-nginx
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - tycoon-net
