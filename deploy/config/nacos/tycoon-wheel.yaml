# ==========================================================
# tycoon-wheel  ——  Nacos 配置中心 data-id: tycoon-wheel.yaml
# ==========================================================
server:
  port: ${SERVER_PORT:8787}
  address: ${SERVER_ADDRESS:0.0.0.0}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:tycoon}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${DB_USER:tycoon}
    password: ${DB_PASSWORD:tycoon123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: tycoon-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:schema.sql

  cloud:
    nacos:
      discovery:
        service: tycoon-wheel
        group: DEFAULT_GROUP
        metadata:
          version: ${APP_VERSION:1.0.0}

  jackson:
    default-property-inclusion: non_null

  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.tycoon.domain
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30
    default-fetch-size: 100
    cache-enabled: false

dubbo:
  application:
    name: tycoon-wheel
    register-mode: application
    qos-enable: false
  registry:
    address: nacos://${NACOS_ADDR:nacos:8848}?namespace=dubbo
    check: false
  consumer:
    check: false
    timeout: 5000
    retries: 0

# ---------------- 游戏规则 ----------------
game:
  cost-per-spin: 10
  initial-points: 100
  daily-limit: 0
  session-ttl-hours: 168
  history-keep: 60
  max-spins-per-minute: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: tycoon-wheel

logging:
  level:
    root: INFO
    com.tycoon: INFO
    org.apache.dubbo: WARN
