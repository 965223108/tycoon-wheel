# ==========================================================
# tycoon-admin  ——  Nacos 配置中心 data-id: tycoon-admin.yaml
# ==========================================================
server:
  port: ${SERVER_PORT:8789}
  address: 0.0.0.0
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:tycoon}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:tycoon}
    password: ${DB_PASSWORD:tycoon123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: admin-pool
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 5000

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:schema.sql

  cloud:
    nacos:
      discovery:
        service: tycoon-admin
        group: DEFAULT_GROUP

  jackson:
    default-property-inclusion: non_null

dubbo:
  application:
    name: tycoon-admin
    register-mode: application
    qos-enable: false
  protocol:
    name: dubbo
    port: ${DUBBO_PORT:20882}
  registry:
    address: nacos://${NACOS_ADDR:nacos:8848}?namespace=dubbo
    check: false
  consumer:
    check: false
    timeout: 5000
  provider:
    timeout: 5000
    retries: 0
    # 默认 200 线程 × 1MB 栈 = 200MB，容器放不下；降到 100（配合 -Xss512k）
    threads: 100

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.tycoon.admin.domain
  configuration:
    map-underscore-to-camel-case: true

# ---------------- 后台鉴权 ----------------
admin:
  jwt:
    # 必须与 gateway 的 gateway.jwt.secret 完全一致
    secret: ${JWT_SECRET:tycoon-admin-jwt-secret-please-change-in-production-0123456789}
    ttl-hours: ${JWT_TTL_HOURS:12}
    issuer: tycoon-admin
  bootstrap:
    username: ${ADMIN_USER:admin}
    password: ${ADMIN_PASSWORD:admin123}

game:
  cost-per-spin: 10
  initial-points: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: tycoon-admin

logging:
  level:
    root: INFO
    com.tycoon: INFO
    org.apache.dubbo: WARN
    com.alibaba.nacos: WARN
