worker_processes auto;
worker_rlimit_nofile 4096;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout  65;
    client_max_body_size 4m;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    log_format main '$remote_addr - [$time_local] "$request" $status '
                    'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Docker 内置 DNS，10 秒刷新
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80 default_server;
        server_name _;

        # 【关键】用变量形式，让 nginx 在【每次请求时】重新解析网关地址。
        # 网关是 vip 模式（DNS 只返回一个稳定 VIP），所以不需要 nginx 做轮询，
        # Swarm 的 IPVS 会把流量分到 2 个网关任务；任务变更时 VIP 记录自动更新，
        # nginx 不会再缓存到失效地址（之前用静态 upstream 就出现过 502）。
        set $tycoon_gateway http://tycoon_gateway:8080;

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            proxy_pass         $tycoon_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        location / {
            proxy_pass         $tycoon_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
            proxy_next_upstream   error timeout http_502 http_503 http_504;
        }
    }
}
